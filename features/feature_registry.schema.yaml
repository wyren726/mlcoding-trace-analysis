schema_document_version: "1.0"
file: {name: feature_registry.csv, format: csv, record_unit: feature_run}
description: 每行登记一次特征运行；旧版本和旧模型结果不会被覆盖。
columns:
  feature_run_id: {type: string}
  feature_set: {type: string}
  feature_version: {type: string, description: 特征定义版本}
  input_batch: {type: string}
  processed_at: {type: datetime, format: ISO-8601}
  record_count: {type: integer, description: 成功写出的特征记录数}
  error_count: {type: integer}
  provider: {type: string, nullable_as_empty: true}
  model: {type: string, nullable_as_empty: true}
  prompt_version: {type: string, nullable_as_empty: true}
  output_path: {type: string}
  status: {type: enum, values: [success, partial, failed]}

sidecar_error_file:
  pattern: <feature_set>/<run_id>/errors.jsonl
  record:
    fields:
      turn_id: {type: [string, "null"]}
      error: {type: string}
