schema_document_version: "1.0"
file: {name: model_capability_comparison.csv, format: csv, record_unit: capability_by_model}
description: 按能力和 Agent 模型分组的观察性分布；不能直接解释为模型因果能力差异。
columns:
  taxonomy_version: {type: string}
  capability_id: {type: string}
  capability_path: {type: string}
  model: {type: string}
  case_count: {type: integer}
  trace_count: {type: integer}
  outcome_labeled_count: {type: integer}
  completed_count: {type: integer}
  completion_rate: {type: [number, "null"], range: [0, 1]}
  unmet_count: {type: integer}
  unmet_rate: {type: [number, "null"], range: [0, 1]}
  feedback_labeled_count: {type: integer}
  negative_feedback_count: {type: integer}
  negative_feedback_rate: {type: [number, "null"], range: [0, 1]}
  difficulty_labeled_count: {type: integer}
  hard_count: {type: integer}
  hard_rate: {type: [number, "null"], range: [0, 1]}
  agent_model_distribution: {type: json_encoded_map, key: model, value: count}
  harness_distribution: {type: json_encoded_map, key: harness, value: count}
  source_batch_distribution: {type: json_encoded_map, key: batch_id, value: count}
  difficulty_distribution: {type: json_encoded_map, key: difficulty, value: count}
  interpretation: {type: string, description: 固定提醒该结果仅为观察性统计}
