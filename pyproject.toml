[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-trace-analysis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "openai>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "jsonschema>=4.18",
  "referencing>=0.30",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"trace_analysis.web" = ["static/*"]
"trace_analysis.pipeline.stage_06_trace_quality_labeling" = ["config/*", "schemas/*"]
