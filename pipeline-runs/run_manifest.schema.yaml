schema_document_version: "1.0"
file: {name: run_manifest.json, format: json, record_unit: pipeline_run}
description: 编排状态账本；用于断点续跑和定位各阶段产物，不是分析数据本身。
record:
  type: object
  fields:
    run_id: {type: string}
    status: {type: string, examples: [running, completed, failed, waiting_for_human_review]}
    created_at: {type: datetime, format: ISO-8601}
    finished_at: {type: [datetime, "null"], format: ISO-8601}
    config_path: {type: string}
    sources: {type: array, items: {type: string}}
    config: {type: object, description: 本次运行实际使用的配置快照}
    stages:
      type: map
      key: stage_name
      value:
        type: object
        fields:
          status: {type: enum, values: [running, completed, failed]}
          started_at: {type: datetime}
          finished_at: {type: [datetime, "null"]}
          duration_seconds: {type: [number, "null"]}
          artifacts: {type: array, items: {type: string}, description: 该阶段输出路径}
          result: {type: object, description: 阶段实现返回的摘要，结构随阶段变化}
          input_fingerprint: {type: [string, "null"], description: 判断能否安全复用阶段结果}
          error: {type: [string, "null"]}
    next_action: {type: [string, "null"]}
    final_core_path: {type: [string, "null"]}
    final_taxonomy_version: {type: [string, "null"]}

stage_name_examples:
  - preprocess
  - basic_features
  - semantic:user_feedback
  - semantic:demand_capability_instances
  - candidate_core
  - extension:model_comparison
  - extension:training_selection
